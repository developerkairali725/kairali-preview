<script>

function nameValidation(value)  //validation  like  enter  only characters

{

 if ((event.keyCode > 64 && event.keyCode < 91) || (event.keyCode > 96 && event.keyCode < 123) || event.keyCode == 8 || event.keyCode == 32)

   return true;

  else

   {

    //alert("Please Enter only character");

    return false;

   } 

}



function onlyNumber(evt) {

  

        evt = (evt) ? evt : window.event;

        var charCode = (evt.which) ? evt.which : evt.keyCode;

        if ( (charCode > 31 && charCode < 48) || charCode > 57) {

            return false;

        }

        return true;

  }



function isAValidEmail(email)

{                

var emailregex=/^([\w-]+(?:\.[\w-]+)*)@((?:[\w-]+\.)*\w[\w-]{0,66})\.([a-z]{2,6}(?:\.[a-z]{2})?)$/i;

var match=email.match(emailregex);

if(!match)

{

return false;

}

else

{

return true;

}           

}

</script>
