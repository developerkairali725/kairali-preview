# gates/registry.yaml — THE UNIFIED GATE REGISTRY (one registry, three site classes)
#
# LAW (CLAUDE.md §GATE REGISTRY, added 2026-07-18; source: Abilash's 17 Jul rule,
# docs/plans/2026-07-17-factory-audit-and-launch-roadmap.md §7 + PROMPT 5):
#   · Every rigorous check is defined ONCE, here. The three site classes are
#     commerce (Shopify stores), organic (Factory + WordPress content sites),
#     landing (/lp/<campaign> single-pagers).
#   · Every gate MUST carry an explicit applicability entry for ALL declared
#     classes: `required`, `{ adapted: "how" }`, or `{ n_a: "reason" }`.
#     A missing class entry FAILS validation (scripts/gate-registry-lint.mjs,
#     merge-blocking in .github/workflows/factory-gate.yml). A gate can never
#     exist for one class and simply be absent from the others.
#   · Per-site ship checklists are GENERATED from this registry by site class,
#     never hand-written. docs/checklists/ masters and SITE_LAUNCH_CHECKLIST_v1.0.md
#     remain the historical source texts; this file is the operational law.
#   · Gates are added, never weakened (CLAUDE.md rule g). Removing or softening
#     a row needs Abilash's ruling logged in DECISIONS.md.
#   · Roadmap §8 plans a FOURTH class, `external` (monitor-only, third-party
#     channels). It lands by adding `external` to `classes:` below — which makes
#     every gate fail validation until it carries an explicit external entry.
#     That is the no-miss guarantee scaling, by design.
#
# FIELD CONTRACT (validated by scripts/gate-registry-lint.mjs):
#   id                — unique kebab-case slug.
#   name              — short human name.
#   what_it_verifies  — one line, plain language.
#   severity          — blocker  (merge/ship-blocking: the site does not move)
#                       high     (launch-evidence item: must pass before go-live)
#                       advisory (recurring/monitoring: findings routed, not blocking)
#   run               — automated (deterministic script/CI) · agent (LLM subagent
#                       with structured PASS/FAIL output) · human (a named person).
#   status            — built (enforcement exists and runs) · partial (exists but
#                       does not cover the gate's full claim — the gap is stated)
#                       · planned (named mechanism not built yet — ref MUST start
#                       with "PLANNED").
#   script_or_agent_ref — the real enforcing artifact (paths are existence-checked
#                       for built/partial), or "PLANNED: …" for planned gates.
#   source            — where the check came from (checklist item, doctrine rule).
#   applicability     — commerce / organic / landing, per the law above.

