# gates/class-map.yaml — POLICY-COMPOSITION OVERLAY on the unified gate registry
#
# LAW (merge plan §2.2 + §7.1 decision 2, amended per external review §12;
# M0(a) disposition 3, docs/reports/2026-07-19-m0a-paper-dryrun.md):
#   · gates/registry.yaml and its three lint-enforced site classes
#     (commerce / organic / landing) stay SUPREME. site_class below MIRRORS the
#     registry's classes line and is the PRIMARY dimension: the registry's
#     applicability entry for a property's site_class is the floor of its gate
#     set, always.
#   · This file is an OVERLAY. An overlay row may ADD gates to a matching
#     vector, or ADAPT a gate with a written reason that only sharpens the lens.
#     It may NEVER remove, n_a, waive, or soften a registry-required gate
#     (CLAUDE.md rule g: gates are added, never weakened). The schema has no
#     removal channel by construction, and scripts/class-map-lint.mjs hard-fails
#     any row that tries to smuggle one in (forbidden keys, softening language).
#   · The dimension list is plan §2.2's list COMPLETE — business model, asset
#     situation (new/existing/migration), entity register, locale/market
#     (`locale_market` below: launch locale set + claims-market lens, values
#     compiled from SITE_DESIGN_LOCALE_REGISTER.md), platform — plus scope
#     (M0(a) disposition 3). A plan-named dimension is never silently dropped;
#     scripts/class-map-lint.mjs requires every one on every vector.
#   · The selector NEVER silently drives anything: every dimension is declared
#     in `dimensions:`, every fleet property carries its full vector in
#     `properties:`, every overlay is a declared, linted row, and every
#     combination a real Kairali property or package workflow uses must resolve
#     to ONE unambiguous gate set (scripts/class-map-lint.mjs, both directions).
#   · scope (project | change) is M0(a) disposition 3 made operational:
#     scope: project = the FULL battery, per-site pre-launch + scheduled
#     sweeps; scope: change = the diff-relevant subset (`scope_map` below).
#     Gates are not weakened; their BINDING SCOPE is declared, linted, and
#     owner-visible.
#   · scope_map is the FLOOR partition, not the whole answer (external review
#     pass 2, finding B5: a fixed global partition is not a diff-sensitive
#     resolver). `change_triggers` below is the ADDITIVE second half: rows
#     keyed to changed paths / change kinds pull project_only gates INTO a
#     specific change's battery. A change's gate set is
#       change_relevant ∪ (adds of every trigger whose when_changed matches)
#     and the FAIL-CLOSED LAW (`fail_closed:` below, lint-pinned) governs
#     every change the triggers cannot classify: unknown never buys a subset.
#   · The 24 package workflows (docs/process/os-2026/package/05_WORKFLOWS/) are
#     TEST VECTORS: each maps to a property-shaped vector that MUST resolve.
#
# Validated by scripts/class-map-lint.mjs (control probes + both-directions
# tests in scripts/test/class-map-lint.test.js).

