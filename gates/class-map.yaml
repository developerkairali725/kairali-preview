# ── Change kinds (external review pass 2, B5 remedy) ─────────────────────────
# The caller-declared classifications a diff may carry when paths alone cannot
# express it: a route rename or deletion under sites/**/app/** is a diff of
# ABSENCES — no surviving path can glob-match it, so the resolver receives it
# as a declared kind. `content-only` is the ONLY kind that may claim the plain
# change_relevant floor when no trigger matches, and it is an assertion the
# caller must be able to prove (prose/asset-only diff, no route/config/meta
# surface touched) — an unasserted or unprovable classification fails closed.
change_kinds: [route-rename, route-delete, content-only]

# ── FAIL-CLOSED LAW (lint-pinned: this block must exist with EXACTLY these
# keys and values; any edit is a lint finding — rule g has no quiet lane) ─────
#   · unmatched_change: a change that matches NO change_trigger AND is not
#     provably content-only (declared kind `content-only`) runs the FULL
#     battery for its property. Unknown classification NEVER buys a subset.
#   · unknown_dimension: a property carrying `unknown` in ANY dimension gets
#     NO subset benefit — full battery PLUS every situation add (overlay) that
#     could match under any resolution of the unknown value (unknown matches
#     as a wildcard when composing, never as a miss).
fail_closed:
  unmatched_change: full-battery
  unknown_dimension: full-battery-plus-situation-adds

# ── Change triggers (ADDITIVE — diff-sensitive resolver, B5 remedy) ──────────
# Each row: {id, when_changed: [path globs and/or kind:<change_kind>],
# adds: [gate ids]}. Semantics: if ANY when_changed entry matches ANY changed
# path (globs: * = one segment, ** = any depth incl. zero) or ANY declared
# change kind, the row's adds join the change's battery. Rows only ever ADD
# (rule g): removing or narrowing a row is a gate-weakening and needs the
# owner's DECISIONS.md ruling. The lint enforces that every diff-reachable
# gate the B5 finding names is carried by at least one row (REQUIRED_TRIGGERED
# in scripts/class-map-lint.mjs) — deleting a row below cannot silently strand
# a gate back in project_only-only land.
# Path facts (verified against the tree, 19 Jul 2026): sites use app/ and
# (abhilashkr) src/app/; forms surface = packages/forms + app/contact +
# app/api/enquiry; schema/analytics/consent/i18n are packages/*.
change_triggers:
  # URL/redirect surfaces: redirect config, middleware, route renames/deletions
  - id: url-redirect-surfaces
    when_changed: [sites/*/next.config.*, sites/*/middleware.*, sites/*/src/middleware.*, sites/*/vercel.json, kind:route-rename, kind:route-delete]
    adds: [redirect-map-tests, meta-canonical-crawl-files, internal-link-crawl]
  # forms + enquiry endpoints: parity with CRM and consent must re-verify
  - id: forms-surfaces
    when_changed: [packages/forms/**, sites/*/app/contact/**, sites/*/src/app/contact/**, sites/*/app/api/enquiry/**, sites/*/src/app/api/enquiry/**]
    adds: [forms-crm-parity, consent-mode]
  # structured-data source: JSON-LD emitters
  - id: schema-structured-data
    when_changed: [packages/schema/**]
    adds: [schema-jsonld]
  # analytics/tracking implementation + consent plumbing
  - id: analytics-tracking
    when_changed: [packages/analytics/**, packages/consent/**]
    adds: [ga4-stream, gtm-conversion-events, consent-mode]
  # locale/i18n surfaces: locale routes and the i18n package
  - id: locale-surfaces
    when_changed: [packages/i18n/**, sites/*/app/de/**, sites/*/app/fr/**, sites/*/src/app/de/**, sites/*/src/app/fr/**]
    adds: [hreflang-reciprocal, meta-canonical-crawl-files]
  # security surface: middleware, headers config (next.config), API routes
  - id: security-surfaces
    when_changed: [sites/*/middleware.*, sites/*/src/middleware.*, sites/*/next.config.*, sites/*/app/api/**, sites/*/src/app/api/**]
    adds: [zap-baseline]
  # meta/canonical/crawl files: metadata exports (layout/page), robots, sitemap, llms.txt
  - id: meta-crawl-surfaces
    when_changed: [sites/*/app/robots.*, sites/*/app/sitemap.*, sites/*/app/llms.txt/**, sites/*/app/**/layout.tsx, sites/*/src/app/**/layout.tsx, sites/*/app/**/page.tsx, sites/*/src/app/**/page.tsx]
    adds: [meta-canonical-crawl-files]
  # keyword-bearing pages: H1/title edits cannot be path-distinguished from any
  # other page edit, so EVERY page-file change re-verifies the keyword map
  - id: keyword-bearing-pages
    when_changed: [sites/*/app/**/page.tsx, sites/*/src/app/**/page.tsx, sites/*/app/**/page.mdx, sites/*/src/app/**/page.mdx]
    adds: [keyword-map]

