# ── Overlays (ADD or ADAPT only — never remove, never soften) ────────────────
# TWO ORTHOGONAL AXES — read this before auditing the adds-lists below:
#   · WHICH gates apply to a property = registry floor for its site_class
#     + these overlay adds/adapts. That is ALL an adds-list here decides.
#   · WHEN those gates bind = scope_map (floor partition) + change_triggers
#     (diff-keyed additive pulls). A gate sitting in project_only is NOT
#     "removed" from a property that an overlay adds it to — the overlay
#     decided it APPLIES; scope_map/change_triggers decide WHICH WORK ITEMS
#     run it. Reading the two axes as one partition produced a false DATA
#     FAULT in an external audit — they compose, they do not compete.
# `when` values may be a scalar or an inline list (list = any-of).
# `adds` ids must exist in gates/registry.yaml, or be on the FIXED
# pending-sibling list (axe-core-a11y, zap-baseline, redirect-map-tests,
# rollback-verification, scaled-content, baseline, launch-certificate) — those
# are tolerated-and-reported by the lint until the sibling registry rows land.
overlays:
  # HARD GATE 7 also binds per clinical CHANGE independently of scope_map —
  # this row is the per-project emphasis, not the only carrier of the law.
  - id: clinical-register-emphasis
    when:
      entity_register: ktahv-clinical
    adapts:
      compliance-lint: "KTAHV clinical lock binds at full strength incl. DE/FR banned-word equivalents; zero findings, and the claims lens runs clinical-register-strict."
      human-audit-round: "Adds Dr. Deepu John's clinical sign-off (HARD GATE 7) on top of the standard four-role round — one MORE signature, never one fewer."
  # existing/migration assets: ranking value must be measured and protected before it is touched
  - id: legacy-asset-continuity
    when:
      asset_situation: [existing, migration]
    adds: [baseline, redirect-map-tests]
  - id: migration-rollback
    when:
      asset_situation: migration
    adds: [rollback-verification]
  # B2B surfaces are read by partner audiences — same bar, sharper lens
  - id: b2b-partner-audience-lens
    when:
      business_model: b2b
    adapts:
      beauty-conformance: "Judged against the owner paper's B2B partner-audience chapters (five partner audiences) — the bar is unchanged, the lens is sharpened to partner readers and quote-request intent."
  # live WordPress carries the fleet's only compromised-history platform surface
  - id: wordpress-attack-surface
    when:
      platform: wordpress
    adds: [zap-baseline]

# ── Binding scope (M0(a) disposition 3) ──────────────────────────────────────
# scope: project  = the FULL composed battery, per-site pre-launch + scheduled
#                   sweeps (project engagements: site build / rebuild / campaign).
# scope: change   = the diff-relevant subset below (the CH-1 walk's Phase-5 row
#                   + every merge-blocking per-PR CI lint + every doctrine-bound
#                   per-change audit, by construction).
# change_relevant ∪ project_only = every registry gate id, exactly once
# (linted). Nothing here weakens a gate: it declares WHERE each one binds.
#
# scope_map is the FLOOR, never the ceiling (external review pass 2, B5): a
# change that touches a URL surface, a form, a canonical, schema, tracking, a
# locale file, or the security surface pulls the matching project_only gates
# into ITS battery via `change_triggers` below — the per-change gate set is
#   change_relevant ∪ (adds of every trigger whose when_changed matches the diff)
# and an unclassifiable change runs the FULL battery (`fail_closed:` below).
scope_map:
  change_relevant:
    # merge-blocking CI — runs on every PR by construction
    - build-clean
    - factory-spec-suite
    - compliance-lint
    - brand-lint
    - banned-string-lint
    - cta-label-lint
    - honest-ymyl-content-lint
    - footer-socials-present
    - s3-keyword-gates
    - factory-matrix-self-registration
    - lighthouse-budgets
    - unit-tests-discovered
    - secret-scan
    - dependency-audit
    - security-review-diff
    # M0(a) §2 Phase-5 row (diff-relevant battery for CH-1)
    - beauty-conformance
    - go-science-conformance
    - design-external-ai-review-post
    - axe-core-a11y
    # doctrine-bound per-change audits (rules n, o, p, r, s — after EVERY build/visual change / draft / scrape / pre-PR)
    - design-qa-audit
    - seo-aeo-geo-audit
    - content-draft-compliance
    - injection-screening
    - security-posture-audit
    # commerce diff lane (rules l/m/p: after any bulk store/theme change)
    - catalog-compliance-audit
    - shopify-theme-check
    - checkout-flows
    - price-inventory-integrity
    # LP optimisation changes re-verify their own gates
    - lp-noindex-single-cta
