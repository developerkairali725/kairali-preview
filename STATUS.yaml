# `node scripts/status-build.mjs` to regenerate the dashboard snapshot.
#
# SCHEMA
#   workstreams[]: { name, status, next_milestone, due, tokens_spent, cost_inr, hours }
#   sites[]:       { name, entity, stage, owner, blocker, updated, preview_url, live_url }
#   preview_url:   the site's Vercel deployment URL (real + verified responding, HARD GATE 6)
#                  or null = no Vercel project yet, local-only preview (dashboard shows a quiet marker)
#   live_url:      https://<domain>, ONLY for stage=live sites and only after verifying it responds; else null
