#
# BUDGET-BURN NOTE: tokens_spent / cost_inr / hours are null across the board.
# There is no per-session token/cost/duration ledger yet (agent-log.jsonl is
# machine-local + git-ignored; no cost ledger exists). These are the exact
# baseline the roadmap's Prompt 6 says to START capturing per site. Leaving them
# null rather than inventing numbers (HARD GATE 6). Fill them once instrumented.

