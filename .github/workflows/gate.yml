# Owner-directed maintenance policy, 6 October 2026.
# Build/browser QA lives in the affected-site factory job, once per site.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Plan affected sites
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-site-plan.mjs --base "$BASE" --out "$RUNNER_TEMP/site-plan.json"

      - name: CI regression tests
        run: node --test scripts/test/*.test.mjs scripts/test/site-app-root.test.js scripts/test/lighthouse-gate.test.js scripts/test/content-lint.test.js

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compliance lint (merge-blocking, Checklist A3)
        run: node scripts/ci-scoped-checks.mjs compliance "$RUNNER_TEMP/site-plan.json"

      - name: Package tests
        run: node --test packages/*/test/*.test.js

      - name: Dependency audit
        run: node scripts/lib/security-audit.mjs

      # gitleaks CLI directly (not gitleaks/gitleaks-action@v2): the Action now
      # requires a paid GITLEAKS_LICENSE for organization-owned repos, which broke
      # this gate when the repo moved to kairali-digital. Same scanner, same rules,
      # full-history scan — gate strength unchanged (CLAUDE.md rule g).
      - name: Secret scan (gitleaks)
        id: secret-scan
        run: |
          # ≥8.25 required: .gitleaks.toml uses rule-scoped AND allowlists
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/gitleaks-redacted.json"

      - name: Report secret scan locations
        if: ${{ failure() && steps.secret-scan.outcome == 'failure' }}
        run: |
          # Print only location metadata, never Match/Secret or source excerpts.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const report = path.join(process.env.RUNNER_TEMP, 'gitleaks-redacted.json');
          if (!fs.existsSync(report)) {
            throw new Error('Secret scan failed without a report; inspect the scanner error above.');
          }
          const findings = JSON.parse(fs.readFileSync(report, 'utf8'));
          if (!Array.isArray(findings)) throw new Error('Invalid secret scan report');
          if (findings.length === 0) throw new Error('Secret scan failed with zero findings; inspect the scanner error above.');
          console.log(JSON.stringify(findings.map(({ RuleID, File, StartLine, Commit }) => ({ RuleID, File, StartLine, Commit })), null, 2));
          NODE

  # Ship Gate A-13: Claude security review on every PR diff (ANTHROPIC_API_KEY
  # landed 14 Jul 2026). Action pinned to a commit SHA (supply-chain hygiene).
  # content-mined/ is excluded: immutable ingested legacy HTML, never shipped.
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # posts findings as PR comments (the A-13 evidence)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Claude security review (Ship Gate A-13)
        id: security
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: 'content-mined'

      - name: A-13 zero-findings gate (fix the cause, never the gate)
        run: |
          COUNT="${{ steps.security.outputs.findings-count }}"
          echo "security findings after FP filtering: ${COUNT:-0}"
          if [ "${COUNT:-0}" != "0" ]; then
            echo "A-13 requires zero high/critical findings — see the PR comments for evidence."
            exit 1
          fi
