name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (turbo)
        run: pnpm build

      - name: Package tests
        run: node --test packages/compliance/test/*.test.js

      - name: Compliance lint (merge-blocking, Checklist A3)
        run: node packages/compliance/bin/lint.js

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # gitleaks CLI directly (not gitleaks/gitleaks-action@v2): the Action now
      # requires a paid GITLEAKS_LICENSE for organization-owned repos, which broke
      # this gate when the repo moved to kairali-digital. Same scanner, same rules,
      # full-history scan — gate strength unchanged (CLAUDE.md rule g).
      - name: Secret scan (gitleaks)
        run: |
          # ≥8.25 required: .gitleaks.toml uses rule-scoped AND allowlists
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  # Ship Gate A-13: Claude security review on every PR diff (ANTHROPIC_API_KEY
  # landed 14 Jul 2026). Action pinned to a commit SHA (supply-chain hygiene).
  # content-mined/ is excluded: immutable ingested legacy HTML, never shipped.
  security-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # posts findings as PR comments (the A-13 evidence)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Claude security review (Ship Gate A-13)
        id: security
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: 'content-mined'

      - name: A-13 zero-findings gate (fix the cause, never the gate)
        run: |
          COUNT="${{ steps.security.outputs.findings-count }}"
          echo "security findings after FP filtering: ${COUNT:-0}"
          if [ "${COUNT:-0}" != "0" ]; then
            echo "A-13 requires zero high/critical findings — see the PR comments for evidence."
            exit 1
          fi

  # TODO (QUESTIONS.md): Lighthouse CI against the Vercel preview URL
  # (perf ≥90 / a11y ≥95 / SEO =100) once the preview-URL wiring is added.
  # Gates are added, never weakened (CLAUDE.md rule g).
