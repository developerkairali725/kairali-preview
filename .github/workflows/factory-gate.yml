# Factory gate — Ship Gate A4 (brand lint) + A2 (factory spec suite).
# Separate workflow from gate.yml ON PURPOSE: gate.yml is being amended by
# PR #2 (docs-sync-v2-shopify); a second file avoids a merge conflict and
# keeps the fast lint path independent of the build cache.
# Gates are added, never weakened (CLAUDE.md rule g).
name: factory-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  brand-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Brand lint (merge-blocking, Ship Gate A4 static layer)
        run: node packages/ui/bin/brand-lint.js

      # ANTI-FABRICATION LINTS — free greps, no API, no cost. They exist because
      # every string they ban was ACTUALLY SHIPPED by us and found later:
      #  · "Every health page is medically reviewed by Dr. Deepu John (BAMS)"
      #    survived in app/llms.txt/route.ts — the file whose entire job is
      #    telling ChatGPT and Perplexity what this site is — a full day after I
      #    swept the content files and reported "0 false claims remaining".
      #  · "Ask a doctor on WhatsApp" pointed at the Priya AI chatbot.
      # A rule that is not executed is a comment. These execute.
      - name: Banned-string lint (fabricated claims, locked facts)
        run: node scripts/banned-string-lint.mjs

      - name: CTA-label lint (no human/clinical claim on a bot channel)
        run: node scripts/cta-label-lint.mjs

      # Discovered by find, NOT a fixed glob. The old glob was
      # `packages/*/test/*.test.js`, so sites/whatisayurveda.com/test/
      # medical-review.test.js — the ONLY test guarding our anti-fabrication
      # gate (no physician review may be asserted without a real sign-off) —
      # never ran. That is the second time a test was dead on arrival because it
      # sat outside the glob (see tests/ktahv-critical-flows.spec.ts). A test
      # that does not run is not a gate; it is a comment.
      - name: All tests (packages/* AND sites/*) — discovered, not globbed
        run: |
          files=$(find packages sites scripts -path '*/test/*.test.js' -not -path '*/node_modules/*' | sort | tr '\n' ' ')
          if [ -z "$files" ]; then echo "::error::no test files discovered — the discovery is broken"; exit 1; fi
          echo "running $(echo $files | wc -w) test files:"; for f in $files; do echo "  · $f"; done
          node --test $files

  factory-spec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every Factory site adds itself here at scaffold time (Ship Gate A2).
        # abhilashkr + kairali.ai are imported/internal surfaces — not yet in
        # the matrix; adding them is a QUESTIONS.md item for Abilash.
        site: ["sites/arogyakendra.com", "sites/kairali.com", "sites/whatisayurveda.com", "sites/kairalicenters.com"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (turbo)
        run: pnpm build

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Factory spec suite (Ship Gate A2 + A4 browser layer)
        run: pnpm exec playwright test tests/factory
        env:
          SITE: ${{ matrix.site }}
