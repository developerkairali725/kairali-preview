# Factory gate — Ship Gate A4 (brand lint) + A2 (factory spec suite).
# Separate workflow from gate.yml ON PURPOSE: gate.yml is being amended by
# PR #2 (docs-sync-v2-shopify); a second file avoids a merge conflict and
# keeps the fast lint path independent of the build cache.
# Gates are added, never weakened (CLAUDE.md rule g).
name: factory-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  brand-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Brand lint (merge-blocking, Ship Gate A4 static layer)
        run: node packages/ui/bin/brand-lint.js

      # ANTI-FABRICATION LINTS — free greps, no API, no cost. They exist because
      # every string they ban was ACTUALLY SHIPPED by us and found later:
      #  · "Every health page is medically reviewed by Dr. Deepu John (BAMS)"
      #    survived in app/llms.txt/route.ts — the file whose entire job is
      #    telling ChatGPT and Perplexity what this site is — a full day after I
      #    swept the content files and reported "0 false claims remaining".
      #  · "Ask a doctor on WhatsApp" pointed at the Priya AI chatbot.
      # A rule that is not executed is a comment. These execute.
      - name: Banned-string lint (fabricated claims, locked facts)
        run: node scripts/banned-string-lint.mjs

      - name: CTA-label lint (no human/clinical claim on a bot channel)
        run: node scripts/cta-label-lint.mjs

      # The honest-YMYL content gate (BUILD_PLAN §2.7, 35 rules). Existed since
      # 15 Jul with passing unit tests — but the gate itself never ran against
      # the real content in CI, so 84 real content errors sat invisible behind
      # a green checkmark. A gate that only lints its fixtures is a comment.
      # Its own self-test (r23) refuses to report a pass if the scanner breaks.
      - name: Content lint (whatisayurveda honest-YMYL gate, §2.7 — merge-blocking)
        run: node scripts/content-lint.mjs --quiet

      # S3 keyword gates arm themselves the moment S3 produces artifacts. While
      # none exist the step says so LOUDLY (no silent skip — CLAUDE.md launch
      # evidence rules); once docs/keywords/ lands, these become merge-blocking
      # with no workflow edit.
      - name: S3 keyword gates (seed-lint + keyword-validate — armed when artifacts exist)
        run: |
          armed=0
          for seeds in docs/keywords/*/seeds.json; do
            [ -e "$seeds" ] || continue
            armed=1
            dir=$(dirname "$seeds")
            echo "── seed-lint: $dir"
            node scripts/seed-lint.mjs --seeds "$seeds" --ontology "$dir/ontology.json"
            if [ -e "$dir/demand.json" ]; then
              echo "── keyword-validate: $dir"
              node scripts/keyword-validate.mjs --artifact "$dir/demand.json" --ontology "$dir/ontology.json" --seeds "$seeds"
            fi
          done
          if [ "$armed" = 0 ]; then
            echo "::notice::S3 keyword gates NOT ARMED — no docs/keywords/*/seeds.json artifacts exist yet. The gates arm automatically when S3 produces them."
          fi

      # SELF-REGISTRATION GATE (retro-audit 17 Jul, process fix #1). The matrix
      # below once promised "every Factory site adds itself here at scaffold
      # time" in a comment — and four sites then shipped without ever entering
      # it, so the browser gate never ran on them. This step makes the promise
      # mechanical: a sites/<domain> with a site.config.json that is absent
      # from ANY site matrix in this file fails the PR that introduces it.
      - name: Factory matrix self-registration lint (site on disk ⇒ site in matrix)
        run: node scripts/factory-matrix-lint.mjs

      # LAUNCH EVIDENCE GATE (retro-audit 17 Jul, process fix #2). The 16-Jul
      # wave shipped with design-qa/seo reports but NO filled checklists, NO
      # wiki/log.md entries, NO LEARNINGS retros — the evidence layer was
      # remembered, and memory failed. Now it is checked: audit reports in
      # launches/<domain>/ without the rest of the evidence set block the PR.
      - name: Launch evidence gate (reports ⇒ checklists + wiki/log + LEARNINGS)
        run: node scripts/launch-evidence-gate.mjs

      # UNIFIED GATE REGISTRY (roadmap §7 / PROMPT 5, 18 Jul). One registry,
      # three site classes: every gate in gates/registry.yaml must carry an
      # explicit entry for commerce, organic AND landing — required, adapted
      # ("how"), or n_a ("reason"). A missing class entry fails the PR: a check
      # that exists for one class and is simply absent for another is how the
      # "19-gate check" orphan and the one-site content-lint scope happened.
      # Per-site ship checklists are GENERATED from the registry, never
      # hand-written (CLAUDE.md §GATE REGISTRY).
      - name: Gate-registry lint (every gate × every class — no missing entries)
        run: node scripts/gate-registry-lint.mjs

      # Discovered by find, NOT a fixed glob. The old glob was
      # `packages/*/test/*.test.js`, so sites/whatisayurveda.com/test/
      # medical-review.test.js — the ONLY test guarding our anti-fabrication
      # gate (no physician review may be asserted without a real sign-off) —
      # never ran. That is the second time a test was dead on arrival because it
      # sat outside the glob (see tests/ktahv-critical-flows.spec.ts). A test
      # that does not run is not a gate; it is a comment.
      - name: All tests (packages/* AND sites/*) — discovered, not globbed
        run: |
          files=$(find packages sites scripts -path '*/test/*.test.js' -not -path '*/node_modules/*' | sort | tr '\n' ' ')
          if [ -z "$files" ]; then echo "::error::no test files discovered — the discovery is broken"; exit 1; fi
          echo "running $(echo $files | wc -w) test files:"; for f in $files; do echo "  · $f"; done
          node --test $files

  # THE FRONT GATE (session 2D). Everything else in this file guards the BACK of
  # the pipeline — it checks work that already happened. This one checks whether
  # the work was allowed to happen at all: a PR that adds or changes pages under
  # sites/<domain> while launches/<domain>/approvals.yaml lacks a signed row
  # FAILS. CI never judges the brief, the strategy or the design — that judgment
  # is Abilash's and stays his. CI only makes an UNAPPROVED build un-mergeable,
  # which is the one thing prose could never do: session 2C's gates could all go
  # green on a site he had never agreed to build.
  #
  # Own job (not a step in brand-lint) so it is its own required-check context,
  # and because it needs the full history brand-lint does not.
  front-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gate diffs against the PR base; a shallow clone has no base

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No pnpm install: the gate is dependency-free by design (a front gate that
      # can be broken by a bad lockfile is a front gate that gets bypassed).
      # BASE via env, never interpolated into the shell line: these are SHAs
      # today, but the safe pattern costs nothing and the unsafe one is how
      # workflow injection starts (CLAUDE.md (r): external input is DATA).
      - name: Front gate (no page ships ahead of its signed approval)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/front-gate.mjs --base "$BASE"

  factory-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one red site must not cancel the evidence for the others
      matrix:
        # Every Factory site adds itself here at scaffold time (Ship Gate A2) —
        # and since 17 Jul that sentence is ENFORCED by factory-matrix-lint.mjs
        # in the brand-lint job (the 16-Jul wave shipped with this comment
        # promising self-registration and no mechanism doing it). abhilashkr +
        # kairali.ai are exempt (imported/internal) — STANDING RULING, Abilash
        # 17 Jul 2026 (D-RULE-MATRIX-EXEMPT); the exemption lives in the lint, loudly.
        site: ["sites/arogyakendra.com", "sites/kairali.com", "sites/whatisayurveda.com", "sites/kairalicenters.com", "sites/arogyashala.in", "sites/healing.recipes", "sites/kairaliyoga.com", "sites/kairalihospitality.com"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (turbo)
        run: pnpm build

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Factory spec suite (Ship Gate A2 + A4 browser layer)
        run: pnpm exec playwright test tests/factory
        env:
          SITE: ${{ matrix.site }}

  # Ship Gate A5 in CI (retro-audit 17 Jul: "Lighthouse (A5) still not in CI" —
  # the budget lived only in SITE_LAUNCH_CHECKLIST_v1.0.md item 5 and the TODO
  # comment at the bottom of gate.yml; no wave site ever ran it). Budgets are
  # the checklist's own: Performance ≥90 · Accessibility ≥95 · SEO = 100,
  # mobile emulation, against the local production build (`next start`) — the
  # same transport the factory spec suite gates on. Preview-URL runs stay a
  # launch-time step; this catches regressions at merge time.
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one red site must not cancel the evidence for the others
      matrix:
        # Kept in lockstep with the factory-spec matrix by factory-matrix-lint.mjs
        # (it validates EVERY site matrix in this file).
        site: ["sites/arogyakendra.com", "sites/kairali.com", "sites/whatisayurveda.com", "sites/kairalicenters.com", "sites/arogyashala.in", "sites/healing.recipes", "sites/kairaliyoga.com", "sites/kairalihospitality.com"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (turbo)
        run: pnpm build

      - name: Lighthouse gate (Ship Gate A5 — perf ≥90 / a11y ≥95 / SEO = 100)
        run: node scripts/lighthouse-gate.mjs
        env:
          SITE: ${{ matrix.site }}
