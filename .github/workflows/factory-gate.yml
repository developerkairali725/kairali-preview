# Owner-directed maintenance policy, 6 October 2026.
# One site edit selects that site; shared inputs select actual consumers.
# Historical design/signature/process ledgers are not software merge gates.
name: factory-gate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected_sites: ${{ steps.plan.outputs.affected_sites }}
      browser_sites: ${{ steps.plan.outputs.browser_sites }}
      site_count: ${{ steps.plan.outputs.site_count }}
      has_sites: ${{ steps.plan.outputs.has_sites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan affected sites and shared dependencies
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-site-plan.mjs --base "$BASE"
  brand-lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Brand and customer-facing claims for affected sites
        env:
          AFFECTED: ${{ needs.changes.outputs.affected_sites }}
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/site-plan.json", JSON.stringify({sites:JSON.parse(process.env.AFFECTED)}))'
          node scripts/ci-scoped-checks.mjs brand "$RUNNER_TEMP/site-plan.json"
  site-check:
    needs: changes
    if: needs.changes.outputs.has_sites == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.affected_sites) }}
    env:
      SITE: ${{ matrix.site }}
      AHV_STAGING: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build this site and its workspace dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-build-site.mjs
      - name: Site unit tests
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/site-plan.json", JSON.stringify({sites:[process.env.SITE]}))'
          node scripts/ci-scoped-checks.mjs unit "$RUNNER_TEMP/site-plan.json"
      - name: Install browser
        if: contains(fromJSON(needs.changes.outputs.browser_sites), matrix.site)
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop and mobile functional checks
        if: contains(fromJSON(needs.changes.outputs.browser_sites), matrix.site)
        run: pnpm exec playwright test tests/factory
      - name: Lighthouse performance, accessibility and SEO
        if: contains(fromJSON(needs.changes.outputs.browser_sites), matrix.site)
        run: node scripts/lighthouse-gate.mjs
  factory-complete:
    if: always()
    needs: [changes, brand-lint, site-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every affected-site check
        env:
          RESULTS: ${{ toJSON(needs) }}
          SITE_COUNT: ${{ needs.changes.outputs.site_count }}
        run: node scripts/ci-completion.mjs
