packages:
  - "sites/*"
  - "packages/*"
allowBuilds:
  sharp: true
  unrs-resolver: true
overrides:
  postcss: ">=8.5.10"
  # GHSA-8988-4f7v-96qf (moderate): unbounded memory allocation in W3C Baggage
  # propagation, @opentelemetry/core <2.8.0. Transitive via lighthouse>@sentry/node;
  # every declared range accepts ^2.0.0 but pnpm resolved 1.30.1. Remove once
  # lighthouse/@sentry/node resolve >=2.8.0 on their own.
  "@opentelemetry/core@<2.8.0": ">=2.8.0"
  # GHSA advisory 22 Jul 2026 (high): fast-uri host confusion via literal
  # backslash authority delimiter, <=3.1.3. Transitive (ajv family). Remove
  # once parents resolve >=3.1.4 on their own.
  fast-uri: ">=3.1.4"
  # Advisories 22 Jul 2026 (high): sharp <0.35.0 inherits libvips CVE-2026-33327/
  # -33328/-35590/-35591. Direct/transitive image tooling. Remove at sharp's
  # own next bump.
  sharp: ">=0.35.0"
  # 22 Jul 2026: pin the fleet's proven React — the security-override re-resolve
  # floated react 19.2.4 -> 19.2.7 and next@15.5.20's vendored runtime skews
  # against it (patchFetch server/client prerender failure, arogyashala +
  # kairalihospitality). Remove when next bumps deliberately WITH react.
  react: 19.2.4
  react-dom: 19.2.4
