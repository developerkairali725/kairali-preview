# strict-residues.yaml — the STRICT-MODE residue allowlist (M1, plan §10).
# merge-continuity-lint --strict fails any continuity row whose new_home names a
# repo file that does not exist yet. Some of those files are LEGITIMATELY absent
# at M1 because the plan schedules them for a later milestone (§10 M2/M3). This
# file is the explicit, owner-visible register of exactly those residues:
#   - every entry names the missing path, the continuity rows that point at it,
#     the milestone that builds it, the reason, and a review_by date;
#   - an allowlisted residue prints as a LOUD "ALLOWED (M2/M3)" line and does
#     not fail --strict; any residue NOT listed here still fails;
#   - an entry whose file now EXISTS is itself a failure ("stale allowlist
#     row — remove it") — the allowlist can only shrink truthfully, never rot.
# RULE g: nothing here weakens an obligation. The continuity rows keep their
# full text, hash and enforcement; this file only declares WHEN the named
# mechanism lands, and the lint fails the moment the declaration goes stale.
# Read by scripts/merge-continuity-lint.mjs (--strict); tested in
# scripts/test/merge-continuity-lint.test.js.
