<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language and currency switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Mulish:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Mulish',system-ui,sans-serif;color:#2A2118}
a{color:#2A2118}a:hover{color:#121A15}
p{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F4EA">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #121A15">
    <img src="/_blob/e9529bf524f274036e888bd5c9953aad" alt="Kairali — The Ayurvedic Healing Village" style="height: 44px; width: auto">
    <button type="button" onClick="{{ toggle }}" aria-haspopup="dialog" aria-label="Language and currency: {{ langName }}, {{ cur }}" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid rgba(247,244,234,.5); background: transparent; color: #F7F4EA; border-radius: 999px; font-family: 'Mulish', sans-serif; font-weight: 600; font-size: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>
      {{ lang }} · {{ cur }}
    </button>
  </header>
  <div style="padding: 24px 16px; display: flex; flex-direction: column; gap: 10px; opacity: .5">
    <p style="font-family: 'Marcellus', serif; font-size: 30px; line-height: 1.1">Panchakarma, practiced the way it was meant to be.</p>
    <p style="font-size: 15px">14 nights, all-inclusive, from {{ price }}</p>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: rgba(12,17,14,.5)"></div>
    <section role="dialog" aria-modal="true" aria-label="Choose language and currency" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFDF7; padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 14px; max-height: 720px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <p style="font-family: 'Marcellus', serif; font-size: 22px">Language &amp; currency</p>
        <button type="button" onClick="{{ toggle }}" aria-label="Close" style="width: 44px; height: 44px; border: 1px solid rgba(42,33,24,.3); background: transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#121A15" stroke-width="1.8" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </div>
      <p style="font-size: 13px; color: #5C5448">Set for you from your location ({{ detected }}). Change it any time.</p>
      <p style="font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #7A5A22">Language</p>
      <div role="radiogroup" aria-label="Language" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{ langs }}" as="l" hint-placeholder-count="13">
          <button type="button" role="radio" aria-checked="{{ l.checked }}" onClick="{{ l.pick }}" lang="{{ l.code }}" style="{{ l.style }}">{{ l.native }}</button>
        </sc-for>
      </div>
      <p style="font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #7A5A22">Currency</p>
      <div role="radiogroup" aria-label="Currency" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{ curs }}" as="c" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{ c.checked }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.code }}</button>
        </sc-for>
      </div>
      <button type="button" onClick="{{ toggle }}" style="min-height: 54px; background: #121A15; color: #F7F4EA; border: 0; border-radius: 2px; font-family: 'Mulish', sans-serif; font-weight: 600; font-size: 16px">Done</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, lang: 'en', cur: 'INR' };
  }
  renderVals() {
    const L = [
      ['en','English'],['hi','हिन्दी'],['ar','العربية'],['de','Deutsch'],['fr','Français'],['es','Español'],['it','Italiano'],['pt','Português'],['nl','Nederlands'],['ru','Русский'],['zh','中文'],['ja','日本語'],['ko','한국어']
    ];
    const C = ['INR','USD','EUR','GBP','AED'];
    const prices = { INR: '[₹ PRICE]', USD: '[US$ PRICE]', EUR: '[€ PRICE]', GBP: '[£ PRICE]', AED: '[AED PRICE]' };
    const on = 'min-height: 46px; border: 2px solid #121A15; background: #FFFFFF; color: #121A15; font-family: Mulish, sans-serif; font-weight: 700; font-size: 15px; border-radius: 2px';
    const off = 'min-height: 46px; border: 1px solid rgba(42,33,24,.25); background: #FFFFFF; color: #2A2118; font-family: Mulish, sans-serif; font-size: 15px; border-radius: 2px';
    const cur = L.find((x) => x[0] === this.state.lang) || L[0];
    return {
      open: this.state.open,
      toggle: () => this.setState({ open: !this.state.open }),
      lang: this.state.lang.toUpperCase(),
      langName: cur[1],
      cur: this.state.cur,
      price: prices[this.state.cur],
      detected: 'India',
      langs: L.map((x) => ({ code: x[0], native: x[1], checked: x[0] === this.state.lang ? 'true' : 'false', style: x[0] === this.state.lang ? on : off, pick: () => this.setState({ lang: x[0] }) })),
      curs: C.map((c) => ({ code: c, checked: c === this.state.cur ? 'true' : 'false', style: c === this.state.cur ? on : off, pick: () => this.setState({ cur: c }) }))
    };
  }
}
</script>
</body>
</html>
