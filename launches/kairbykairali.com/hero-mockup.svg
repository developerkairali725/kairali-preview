<svg viewBox="0 0 1440 820" xmlns="http://www.w3.org/2000/svg" font-family="'Trebuchet MS', Verdana, sans-serif">
  <!-- DESIGN_DIRECTION mockup — kairbykairali.com "Fresh Pressed".
       Palette = packages/ui/brand-tokens.css ONLY (no invented hexes); the
       distinctness vs the Organics direction is DISTRIBUTION + geometry + type.
       Faces approximated: Quicksand (manual "kair range" voice) -> Trebuchet
       fallback. Photography slots labelled with the REAL library assets.
       NOTE: no "chemical-free"/"organic" wording anywhere on this brand (D3). -->

  <!-- page ground: ivory -->
  <rect width="1440" height="820" fill="#F7F4EA"/>

  <!-- top nav: rounded pill geometry -->
  <rect x="36" y="20" rx="28" width="1368" height="56" fill="#FFFFFF" opacity="0.9"/>
  <text x="76" y="56" font-size="24" letter-spacing="3" fill="#636E25">KAIR</text>
  <text x="146" y="56" font-size="13" fill="#875F1F">by Kairali</text>
  <g font-size="14" fill="#1C1B19">
    <text x="760" y="55">Shampoos</text>
    <text x="866" y="55">Soaps</text>
    <text x="940" y="55">Body Wash</text>
    <text x="1052" y="55">Lotions</text>
    <text x="1136" y="55">About</text>
  </g>
  <rect x="1216" y="32" rx="16" width="152" height="32" fill="#006038"/>
  <text x="1244" y="53" font-size="13" fill="#F7F4EA">Where to buy</text>

  <!-- HERO: centered, airy, leaf-led with marigold energy -->
  <circle cx="1180" cy="240" r="150" fill="#8E9D35" opacity="0.18"/>
  <circle cx="260" cy="560" r="110" fill="#EEB41E" opacity="0.16"/>
  <text x="720" y="220" text-anchor="middle" font-size="15" letter-spacing="5" fill="#875F1F">HERBAL COSMETICS · UNDER THE KAIRALI UMBRELLA</text>
  <!-- Quicksand-style rounded display -->
  <text x="720" y="300" text-anchor="middle" font-size="62" fill="#1C1B19">Everyday care,</text>
  <text x="720" y="372" text-anchor="middle" font-size="62" fill="#636E25">pressed from herbs.</text>
  <text x="720" y="422" text-anchor="middle" font-size="18" fill="#1C1B19" opacity="0.75">Shampoos, soaps, body wash and lotions &#8212; Ayurveda-influenced, made for daily use.</text>
  <!-- CTA pair: chunky rounded -->
  <rect x="560" y="452" rx="26" width="176" height="52" fill="#006038"/>
  <text x="596" y="485" font-size="16" fill="#F7F4EA">See the range</text>
  <rect x="756" y="452" rx="26" width="150" height="52" fill="none" stroke="#636E25" stroke-width="2"/>
  <text x="786" y="485" font-size="16" fill="#636E25">Enquire</text>

  <!-- category card ribbon: tilted rounded cards, ingredient-led -->
  <g>
    <g transform="rotate(-3 240 660)">
      <rect x="120" y="570" rx="20" width="240" height="180" fill="#FFFFFF" stroke="#8E9D35" stroke-width="1.5"/>
      <rect x="144" y="594" rx="10" width="90" height="110" fill="#EEB41E" opacity="0.85"/>
      <text x="250" y="640" font-size="17" fill="#1C1B19">Shampoos</text>
      <text x="250" y="662" font-size="11" fill="#875F1F">6 herbal variants</text>
      <text x="144" y="726" font-size="9.5" fill="#875F1F">PHOTO: kairali-group-shampoo-01.jpg</text>
    </g>
    <g transform="rotate(2 560 660)">
      <rect x="420" y="580" rx="20" width="240" height="180" fill="#FFFFFF" stroke="#8E9D35" stroke-width="1.5"/>
      <rect x="444" y="604" rx="10" width="90" height="110" fill="#8E9D35" opacity="0.85"/>
      <text x="550" y="650" font-size="17" fill="#1C1B19">Soaps</text>
      <text x="550" y="672" font-size="11" fill="#875F1F">hand-made bars</text>
      <text x="444" y="736" font-size="9.5" fill="#875F1F">PHOTO: kairali-group-hand-made-soaps-01.jpg</text>
    </g>
    <g transform="rotate(-2 860 660)">
      <rect x="720" y="572" rx="20" width="240" height="180" fill="#FFFFFF" stroke="#8E9D35" stroke-width="1.5"/>
      <rect x="744" y="596" rx="10" width="90" height="110" fill="#C1882C" opacity="0.8"/>
      <text x="850" y="642" font-size="17" fill="#1C1B19">Body Wash</text>
      <text x="850" y="664" font-size="11" fill="#875F1F">strawberry shower gel</text>
      <text x="744" y="728" font-size="9.5" fill="#875F1F">PHOTO: strawberry-shower-gel PDP shot</text>
    </g>
    <g transform="rotate(3 1160 660)">
      <rect x="1020" y="582" rx="20" width="240" height="180" fill="#FFFFFF" stroke="#8E9D35" stroke-width="1.5"/>
      <rect x="1044" y="606" rx="10" width="90" height="110" fill="#006038" opacity="0.8"/>
      <text x="1150" y="652" font-size="17" fill="#1C1B19">Lotions</text>
      <text x="1150" y="674" font-size="11" fill="#875F1F">+ conditioner</text>
      <text x="1044" y="738" font-size="9.5" fill="#875F1F">PHOTO: grape-seed-almond-lotion-01.jpg</text>
    </g>
  </g>
</svg>
