<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Mulish:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<script src="assets/gallery-hub-data.js"></script>
<style>
body{margin:0;background:#EFE9DA;color:#2A2118;font-family:'Mulish',sans-serif;font-size:18px;line-height:1.7}
a{color:#006038;text-decoration:none}a:hover{color:#004226;text-decoration:underline}
:focus-visible{outline:3px solid #6B7726;outline-offset:2px;box-shadow:0 0 0 6px rgba(247,244,234,.85)}
a:active,button:active{filter:brightness(.88)}
h1,h2,h3,h4{font-weight:400;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
<title>Gallery</title>
<meta name="description" content="This section deals with the public outreach section of Kairali that is dedicated to raising the awareness levels about this village through the means of media.">
<link rel="canonical" href="https://ayurvedichealingvillage.com/gallery/">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="article">
<meta property="og:title" content="Gallery">
<meta property="og:description" content="This section deals with the public outreach section of Kairali that is dedicated to raising the awareness levels about this village through the means of media.">
<meta property="og:url" content="https://ayurvedichealingvillage.com/gallery/">
<meta property="og:image" content="https://ayurvedichealingvillage.com/wp-content/uploads/2023/11/gallery.png">
<meta property="og:image:width" content="1440">
<meta property="og:image:height" content="459">
<meta property="og:image:type" content="image/png">
<meta property="og:site_name" content="Ayurvedic Healing Village">
<meta property="article:modified_time" content="2024-12-10T09:55:12+00:00">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/logo_color-da22eb.svg" sizes="192x192">
</helmet>
<div data-screen-label="Gallery hub — Mobile 390" style="max-width:430px;margin:0 auto;background:#F7F4EA;box-shadow:0 0 40px rgba(70,50,20,.15);position:relative;box-sizing:border-box">
<a href="#main-content" style="position:fixed;left:-9999px;top:12px;z-index:120;background:#5A4420;color:#F7F4EA;padding:14px 24px;border-radius:4px;font-weight:700;font-size:15px" style-focus="left:16px">Skip to main content</a>
<dc-import name="AHV Chrome Header" narrow="true" style="position:sticky;top:0;z-index:80" hint-size="100%,64px"></dc-import>
<main id="main-content">
  <section style="width:min(1220px,94%);margin:0 auto;padding:20px 0 26px">
    <nav aria-label="Breadcrumb" style="font-size:15px;color:#75695A;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <a href="https://ayurvedichealingvillage.com/" onClick="{{ guard }}" style="display:inline-flex;align-items:center;min-height:44px">Home</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page" style="color:#2A2118">Gallery</span>
    </nav>
    <p style="margin:0;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C1882C;line-height:1.5">Kairali — The Ayurvedic Healing Village</p>
    <h1 style="font-family:'Marcellus',serif;font-size:32px;line-height:1.18;margin:8px 0 0;text-wrap:balance">Gallery</h1>
    <p style="font-size:17.5px;line-height:1.65;color:#514a3f;margin:16px 0 0;border-left:3px solid #C1882C;padding-left:16px">{{ intro }}</p>
    <p style="margin:10px 0 0 19px;font-weight:700;font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#8A5A12">{{ introStatus }}</p>
  </section>

  <div style="width:min(1220px,94%);margin:0 auto">
    <img src="assets/img/AHV-Gallery-Landscape.png" alt="" width="1440" height="524" style="width:100%;height:auto;display:block;border-radius:4px"/>
  </div>

  <section aria-labelledby="collections-h" style="width:min(1220px,94%);margin:0 auto;padding:36px 0 56px">
    <h2 id="collections-h" style="font-family:'Marcellus',serif;font-size:26px;line-height:1.2;margin:0 0 4px">Collections</h2>
    <p style="margin:0 0 22px;font-size:16px;color:#75695A;line-height:1.6">{{ tally }}</p>
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="10">
        <li style="min-width:0">
          <a href="{{ c.url }}" onClick="{{ guard }}" style="display:flex;flex-direction:column;background:#fff;border:1px solid #E9E2D3;border-radius:4px;overflow:hidden;color:#2A2118;text-decoration:none" style-hover="border-color:#C1882C;text-decoration:none">
            <img src="{{ c.cover }}" alt="" loading="lazy" style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#EFE9DA"/>
            <span style="display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px">
              <span style="font-family:'Marcellus',serif;font-size:22px;line-height:1.22">{{ c.name }}</span>
              <span style="font-weight:700;font-size:12.5px;letter-spacing:1.8px;text-transform:uppercase;color:#5A4420">{{ c.countLabel }}</span>
              <span style="display:inline-flex;align-items:center;gap:9px;min-height:44px;font-weight:700;font-size:13.5px;letter-spacing:1.6px;text-transform:uppercase;color:#006038">View collection<span aria-hidden="true" style="color:#C1882C">→</span></span>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>
  </section>
</main>
<dc-import name="AHV Chrome Footer" narrow="true" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { document.documentElement.lang = 'en-US'; }
  renderVals() {
    const D = window.AHV_GALLERY_HUB || { cards: [], intro: '', introStatus: '' };
    const A = 'https://ayurvedichealingvillage.com';
    const photos = D.cards.filter(c => c.unit === 'photographs').reduce((a, c) => a + c.count, 0);
    const films = D.cards.filter(c => c.unit === 'films').reduce((a, c) => a + c.count, 0);
    return {
      guard: (e) => { e.preventDefault(); },
      intro: D.intro, introStatus: D.introStatus,
      tally: D.cards.length + ' collections · ' + photos + ' photographs · ' + films + ' films',
      cards: D.cards.map(c => ({ ...c, url: A + c.href, countLabel: c.count + ' ' + c.unit }))
    };
  }
}
</script>
</body>
</html>
