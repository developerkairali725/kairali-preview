<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Mulish:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<script src="assets/gallery-hub-data.js"></script>
<style>
body{margin:0;background:#F7F4EA;color:#2A2118;font-family:'Mulish',sans-serif;font-size:18px;line-height:1.7}
a{color:#006038;text-decoration:none}a:hover{color:#004226;text-decoration:underline}
:focus-visible{outline:3px solid #6B7726;outline-offset:2px;box-shadow:0 0 0 6px rgba(247,244,234,.85)}
a:active,button:active{filter:brightness(.88)}
h1,h2,h3,h4{font-weight:400;margin:0}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
<title>Gallery</title>
<meta name="description" content="This section deals with the public outreach section of Kairali that is dedicated to raising the awareness levels about this village through the means of media.">
<link rel="canonical" href="https://ayurvedichealingvillage.com/gallery/">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="article">
<meta property="og:title" content="Gallery">
<meta property="og:description" content="This section deals with the public outreach section of Kairali that is dedicated to raising the awareness levels about this village through the means of media.">
<meta property="og:url" content="https://ayurvedichealingvillage.com/gallery/">
<meta property="og:image" content="https://ayurvedichealingvillage.com/wp-content/uploads/2023/11/gallery.png">
<meta property="og:image:width" content="1440">
<meta property="og:image:height" content="459">
<meta property="og:image:type" content="image/png">
<meta property="og:site_name" content="Ayurvedic Healing Village">
<meta property="article:modified_time" content="2024-12-10T09:55:12+00:00">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/logo_color-da22eb.svg" sizes="192x192">
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[{"@type":"CollectionPage","@id":"https://ayurvedichealingvillage.com/gallery/","url":"https://ayurvedichealingvillage.com/gallery/","name":"Gallery","description":"This section deals with the public outreach section of Kairali that is dedicated to raising the awareness levels about this village through the means of media.","isPartOf":{"@id":"https://ayurvedichealingvillage.com/#website"},"inLanguage":"en-US"},{"@type":"WebSite","@id":"https://ayurvedichealingvillage.com/#website","url":"https://ayurvedichealingvillage.com/","name":"Ayurvedic Healing Village","inLanguage":"en-US"},{"@type":"BreadcrumbList","@id":"https://ayurvedichealingvillage.com/gallery/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://ayurvedichealingvillage.com/"},{"@type":"ListItem","position":2,"name":"Gallery","item":"https://ayurvedichealingvillage.com/gallery/"}]}]}
</script>
</helmet>
<div data-screen-label="Gallery hub — Desktop 1440">
<a href="#main-content" style="position:fixed;left:-9999px;top:12px;z-index:120;background:#5A4420;color:#F7F4EA;padding:14px 24px;border-radius:4px;font-weight:700;font-size:15px" style-focus="left:16px">Skip to main content</a>
<dc-import name="AHV Chrome Header" hint-size="100%,72px"></dc-import>
<main id="main-content">
  <section style="width:min(1220px,94%);margin:0 auto;padding:32px 0 40px">
    <nav aria-label="Breadcrumb" style="font-size:15px;color:#75695A;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <a href="https://ayurvedichealingvillage.com/" onClick="{{ guard }}" style="display:inline-flex;align-items:center;min-height:44px">Home</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page" style="color:#2A2118">Gallery</span>
    </nav>
    <p style="margin:2px 0 0;font-weight:700;font-size:13px;letter-spacing:2.4px;text-transform:uppercase;color:#C1882C">Kairali — The Ayurvedic Healing Village</p>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 64px;align-items:end;padding-top:10px">
      <h1 style="font-family:'Marcellus',serif;font-size:clamp(34px,3.6vw,54px);line-height:1.12;margin:0;text-wrap:balance">Gallery</h1>
      <div>
        <p style="font-size:19px;line-height:1.65;color:#514a3f;max-width:62ch;margin:0;border-left:3px solid #C1882C;padding-left:20px">{{ intro }}</p>
        <p style="margin:10px 0 0 23px;font-weight:700;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;color:#8A5A12">{{ introStatus }}</p>
      </div>
    </div>
  </section>

  <div style="width:min(1220px,94%);margin:0 auto">
    <img src="assets/img/AHV-Gallery-Landscape.png" alt="" width="1440" height="524" style="width:100%;height:auto;display:block;border-radius:4px"/>
  </div>

  <section aria-labelledby="collections-h" style="width:min(1220px,94%);margin:0 auto;padding:56px 0 80px">
    <h2 id="collections-h" style="font-family:'Marcellus',serif;font-size:clamp(26px,2.4vw,34px);line-height:1.18;margin:0 0 6px">Collections</h2>
    <p style="margin:0 0 30px;font-size:16.5px;color:#75695A">{{ tally }}</p>
    <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 30px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="10">
        <li style="min-width:0">
          <a href="{{ c.url }}" onClick="{{ guard }}" style="display:flex;flex-direction:column;background:#fff;border:1px solid #E9E2D3;border-radius:4px;overflow:hidden;color:#2A2118;text-decoration:none;height:100%" style-hover="border-color:#C1882C;text-decoration:none">
            <img src="{{ c.cover }}" alt="" loading="lazy" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#EFE9DA"/>
            <span style="display:flex;flex-direction:column;gap:6px;padding:18px 20px 22px">
              <span style="font-family:'Marcellus',serif;font-size:24px;line-height:1.2">{{ c.name }}</span>
              <span style="font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#5A4420">{{ c.countLabel }}</span>
              <span style="display:inline-flex;align-items:center;gap:9px;min-height:44px;font-weight:700;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:#006038">View collection<span aria-hidden="true" style="color:#C1882C">→</span></span>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>
  </section>
</main>
<dc-import name="AHV Chrome Footer" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { document.documentElement.lang = 'en-US'; }
  renderVals() {
    const D = window.AHV_GALLERY_HUB || { cards: [], intro: '', introStatus: '' };
    const A = 'https://ayurvedichealingvillage.com';
    const photos = D.cards.filter(c => c.unit === 'photographs').reduce((a, c) => a + c.count, 0);
    const films = D.cards.filter(c => c.unit === 'films').reduce((a, c) => a + c.count, 0);
    return {
      guard: (e) => { e.preventDefault(); },
      intro: D.intro, introStatus: D.introStatus,
      tally: D.cards.length + ' collections · ' + photos + ' photographs · ' + films + ' films',
      cards: D.cards.map(c => ({ ...c, url: A + c.href, countLabel: c.count + ' ' + c.unit }))
    };
  }
}
</script>
</body>
</html>
