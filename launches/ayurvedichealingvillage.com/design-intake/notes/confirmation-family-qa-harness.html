<script>
const A='https://ayurvedichealingvillage.com';const sleep=ms=>new Promise(r=>setTimeout(r,ms));const norm=s=>String(s).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
const FILES=['AHV Page Confirmation Desktop.dc.html','AHV Page Confirmation Mobile.dc.html'];
let netLog=[];
async function load(fr,f,w,route,receipt){fr.style.width=w+'px';await new Promise(r=>{fr.onload=r;fr.src=encodeURI('../'+f)+'?route='+encodeURIComponent(route)+(receipt?'&receipt=prototype':'')+'&w='+w;});const d=fr.contentDocument;const W=d.defaultView;
 // network/event guard: any fetch/XHR/beacon/gtag/fbq/clarity call from the page would be recorded
 netLog=[];const rec=n=>()=>{netLog.push(n);};try{const of=W.fetch;W.fetch=function(u){if(!/\.dc\.html(\?|$)|\.js(\?|$)|\.json(\?|$)/.test(String(u)))netLog.push('fetch:'+u);return of.apply(this,arguments);};W.navigator.sendBeacon=function(u){netLog.push('beacon:'+u);return true;};['gtag','fbq','clarity','dataLayer'].forEach(k=>{if(k in W)netLog.push('global:'+k);});}catch(e){}
 for(let k=0;k<120&&!(d.querySelector('main [data-state]')&&d.querySelector('footer')&&d.head.querySelector('[data-ahv-head]'));k++)await sleep(250);try{await d.fonts.ready;}catch(e){}return d;}
window.runRoute=async function(slug){const D=window.AHV_CONFIRM;const R=D.routes.find(r=>r.slug===slug||r.path===slug);const fr=document.getElementById('fr');const out=[];const pre=document.getElementById('out');
 for(const receipt of [false,true]){for(const [f,ws] of [[FILES[0],[1024,1280,1440,1920]],[FILES[1],[320,390,430]]]){for(const w of ws){const d=await load(fr,f,w,R.path,receipt);const W=d.defaultView,de=d.documentElement,b=d.body;const isM=f.includes('Mobile');const F=[];const ok=(n,c,t)=>{if(!c)F.push('✗'+n+(t?':'+t:''));};
  for(let k=0;k<3;k++){W.scrollTo({top:de.scrollHeight,behavior:'instant'});await sleep(350);}W.scrollTo({top:0,behavior:'instant'});await sleep(200);
  const imgs=[...b.querySelectorAll('main img')];imgs.forEach(i=>{i.loading='eager';});await Promise.all(imgs.map(i=>i.decode().catch(()=>{})));for(let k=0;k<40&&imgs.some(i=>!i.complete);k++)await sleep(250);
  const M=R.metadata;const g=s=>(d.querySelector(s)||{}).content;const cnt=s=>d.querySelectorAll(s).length;
  ok('title',d.title===M.title,d.title);ok('desc',M.description?g('meta[name=description]')===M.description:cnt('meta[name=description]')===0);
  const can=d.querySelector('link[rel=canonical]');ok('canonical',M.canonical?(can&&can.href===M.canonical&&cnt('link[rel=canonical]')===1):!can,'src='+M.canonical);
  ok('noindex',g('meta[name=robots]')==='noindex, follow'&&cnt('meta[name=robots]')===1);
  const og=M.og;ok('og',g('meta[property="og:type"]')===og.type&&g('meta[property="og:title"]')===og.title&&g('meta[property="og:url"]')===og.url&&g('meta[property="og:locale"]')===og.locale&&g('meta[property="og:site_name"]')===og.siteName&&(og.description?!!g('meta[property="og:description"]'):cnt('meta[property="og:description"]')===0));
  ok('ogimg',cnt('meta[property="og:image"]')===1&&g('meta[property="og:image"]')===og.image.url&&(og.image.width?g('meta[property="og:image:width"]')===String(og.image.width):cnt('meta[property="og:image:width"]')===0));
  ok('twitter',g('meta[name="twitter:card"]')==='summary_large_image');ok('hreflang',cnt('link[rel=alternate][hreflang]')===0);ok('lang',de.lang==='en-US');
  ok('noBreadcrumb',!b.querySelector('nav[aria-label="Breadcrumb"]')&&!/BreadcrumbList/.test([...d.querySelectorAll('script[type="application/ld+json"]')].map(s=>s.textContent).join('')));
  ok('noRoutePicker',!b.querySelector('main select, main [role=tablist], main input'));
  const st=b.querySelector('main [data-state]');const state=st&&st.getAttribute('data-state');const main=b.querySelector('main');const mt=norm(main.textContent);
  const h1=b.querySelectorAll('h1');

  else { ok('receiptState',state==='receipt'&&st.getAttribute('data-variant')===R.variant);ok('h1',h1.length===1&&norm(h1[0].textContent)===R.h1,h1.length+' '+(h1[0]&&norm(h1[0].textContent)));
   const exp=[];const expImgs=[];const I=D.images;
   if(R.variant==='next-steps'){ if(R.eyebrow)exp.push(R.eyebrow);exp.push(...R.lede);if(R.note)exp.push(R.note);if(R.stepsHeading)exp.push(R.stepsHeading);R.steps.forEach(s=>{exp.push(s.n,s.h,s.p);if(s.when)exp.push(s.when);});if(R.sooner.eyebrow)exp.push(R.sooner.eyebrow);exp.push(R.sooner.h2,...R.sooner.paragraphs);R.sooner.actions.forEach(a=>exp.push(a.label));exp.push(R.wait.h2,R.wait.lead);R.wait.cards.forEach(c=>{if(c.kicker)exp.push(c.kicker);exp.push(c.h3,c.p);if(c.go)exp.push(c.go);});if(R.trust){exp.push(R.trust.seal);R.trust.items.forEach(t=>exp.push(((t.b||'')+t.rest).trim()));}
     expImgs.push(I[R.hero]);if(R.lotus)expImgs.push(I.lotus);
     const hs=[...main.querySelectorAll('h2,h3')].map(h=>h.tagName.toLowerCase()+'|'+norm(h.textContent));const expHs=[];if(R.stepsHeading)expHs.push('h2|'+R.stepsHeading);R.steps.forEach(s=>expHs.push('h3|'+s.h));expHs.push('h2|'+R.sooner.h2,'h2|'+R.wait.h2);R.wait.cards.forEach(c=>expHs.push('h3|'+c.h3));ok('headingOrder',hs.join('¦')===expHs.join('¦'),hs.length+'/'+expHs.length);
     const links=[...main.querySelectorAll('a')].filter(a=>a.getAttribute('href')!=='#main-content').map(a=>a.getAttribute('href'));const expL=R.sooner.actions.map(a=>a.href).concat(R.wait.cards.map(c=>A+c.href));ok('links',links.join()===expL.join(),links.length+'/'+expL.length);
     ok('em',R.h1Em?(h1[0].querySelector('em')&&norm(h1[0].querySelector('em').textContent)===R.h1Em):!h1[0].querySelector('em'));ok('ledeParas',main.querySelectorAll('[data-lede] p').length===R.lede.length);ok('steps',main.querySelectorAll('[data-step]').length===3);ok('trust',R.trust?main.querySelectorAll('[data-trust-item]').length===3:!main.querySelector('[data-trust]'));
     const wa=main.querySelector('a[href^="https://wa.me"]');ok('extRel',!wa||wa.getAttribute('rel')==='noopener');
   } else if(R.variant==='legacy-queue'){ exp.push(R.brandLine,...R.paragraphs,R.action.label);expImgs.push(I.bookingBg,I.bookingLogo);const l=main.querySelector('a[href="'+R.action.href+'"]');ok('goHome',l&&norm(l.textContent)===R.action.label&&!main.querySelector('a[href*="index.php"]'));ok('paras',main.querySelectorAll('p').length===4);ok('h1Upper',W.getComputedStyle(h1[0]).textTransform==='uppercase'); }
   else { exp.push(R.transcript.heading,...R.transcript.lines);expImgs.push(I.landscape1440,I.lotus,I.poster);ok('transcript',main.querySelectorAll('[data-transcript] li').length===6&&R.transcript.lines.every((l,i)=>norm(main.querySelectorAll('[data-transcript] li')[i].textContent)===l));const po=main.querySelector('img[src$="Consultation-Poster.jpg"]');ok('posterAlt',po&&po.getAttribute('alt')===I.poster.alt);ok('noLinks',main.querySelectorAll('a:not([href="#main-content"])').length===0); }
   const missing=exp.filter(t=>!mt.includes(norm(t)));ok('text',missing.length===0,missing.slice(0,2).join(' | '));
   ok('imgOrder',imgs.map(i=>i.getAttribute('src')).join()===expImgs.map(i=>i.src).join(),imgs.length+'/'+expImgs.length);
   const bad=imgs.filter((im,i)=>{const e=expImgs[i];if(!e)return true;const r=im.getBoundingClientRect();const cover=im.style.objectFit==='cover';return !(im.complete&&im.naturalWidth===e.width&&im.naturalHeight===e.height&&im.getAttribute('alt')===e.alt&&(cover||(r.width<=e.width+.5&&Math.abs(r.width/r.height-e.width/e.height)<0.02))&&r.right<=W.innerWidth+.5);});ok('imgDecodeRatio',bad.length===0,bad.map(i=>i.getAttribute('src').slice(-22)).join(','));
  }
  ok('noInvented',!/₹|\$\d|€|reference number|booking id|appointment (is )?confirmed|payment received|paid/i.test(mt));
  ok('noNet',netLog.length===0,netLog.join(','));ok('noForm',!main.querySelector('form'));
  const ctrls=[...b.querySelectorAll('main a,main button')].filter(e=>{const q=e.getBoundingClientRect();return q.width&&q.height;});ok('44px',ctrls.every(e=>{const q=e.getBoundingClientRect();return q.height>=43.5&&q.width>=43.5;}),ctrls.filter(e=>e.getBoundingClientRect().height<43.5).map(e=>norm(e.textContent).slice(0,20)).join(','));
  ok('fs',[...main.querySelectorAll('p:not([data-brand]),li')].every(e=>parseFloat(W.getComputedStyle(e).fontSize)>=16.4));ok('labelFs',[...main.querySelectorAll('[data-brand],[data-step-n],[data-eyebrow],[data-card-kicker],[data-sooner-eyebrow]')].every(e=>parseFloat(W.getComputedStyle(e).fontSize)>=12.5));
  const first=ctrls[0];if(first){first.focus();ok('kb',d.activeElement===first);const ev=new W.MouseEvent('click',{bubbles:true,cancelable:true});first.dispatchEvent(ev);ok('guard',ev.defaultPrevented);}
  const top=de.scrollWidth===de.clientWidth;W.scrollTo({top:de.scrollHeight,behavior:'instant'});let lastH=0,stable=0;await Promise.all([...b.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));for(let k=0;k<40&&stable<3;k++){if(Math.abs(W.scrollY+W.innerHeight-de.scrollHeight)<=2&&lastH===de.scrollHeight)stable++;else stable=0;lastH=de.scrollHeight;await sleep(200);W.scrollTo({top:de.scrollHeight,behavior:'instant'});}
  const end=de.scrollWidth===de.clientWidth;const footer=[...b.querySelectorAll('footer')].filter(x=>x.getBoundingClientRect().height>0).pop();const fb=footer?Math.round(footer.getBoundingClientRect().bottom-W.innerHeight):NaN;const inner=isM?de.querySelector('[data-screen-label]'):null;ok('contain',top&&end&&(!inner||inner.scrollWidth<=inner.clientWidth+.5),de.scrollWidth+'/'+de.clientWidth);const fbDoc=footer?Math.round(footer.getBoundingClientRect().bottom+W.scrollY-de.scrollHeight):NaN;ok('footerEnd',footer&&Math.abs(fbDoc)<=1&&Math.abs(fb)<=16,'Δdoc='+fbDoc+' Δview='+fb);
  out.push(R.slug+' '+(receipt?'RECEIPT':'DIRECT ')+' '+(isM?'M':'D')+w+' imgs='+imgs.length+' '+(F.length?F.join(' '):'PASS'));pre.textContent=out.join('\n');}}}
 window.scrollTo(0,0);pre.textContent='DONE '+R.slug+' '+out.filter(l=>l.endsWith('PASS')).length+'/'+out.length+'\n'+out.join('\n');window.__qa=(window.__qa||[]).concat(out);return out;};
window.runAll=async function(){window.__qa=[];const all=[];for(const r of window.AHV_CONFIRM.routes){all.push(...await runRoute(r.slug));}window.scrollTo(0,0);document.getElementById('out').textContent='ALL DONE '+all.filter(l=>l.endsWith('PASS')).length+'/'+all.length+' PASS\n'+all.join('\n');return all;};
if(location.hash==='#all')runAll();else if(location.hash.length>1)runRoute(location.hash.slice(1));
</script></body></html>
